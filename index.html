if(q.img)b+=`<div class=big>${q.img}</div>`;
if(q.t=='hear')b+=`<p class=c><button class=sp style="width:96px;height:96px;font-size:44px;margin:0" data-say="${e(q.say)}" data-url="${e(q.audio||'')}" aria-label="Audio">🔊</button><br><button class=lnk data-act=tr>👁️ Tampilkan teks</button></p>${Q.tr?'<p class=trn>'+q.say+'</p>':''}`;
b+=`<h2>${q.q}</h2>`;
if(q.t=='group'){ready=Object.keys(Q.g).length==q.it.length;ans=q.it.map(x=>x[0]+' → '+q.c[x[1]]).join(', ');
b+=q.it.map((x,j)=>`<div class=gr><b>${x[0]}</b>${q.c.map((c,k)=>`<button class="${Q.chk?(k==x[1]?'ok':Q.g[j]===k?'no':''):(Q.g[j]===k?'on':'')}" data-act=cat data-j=${j} data-k=${k}>${c}</button>`).join('')}</div>`).join('')}
else if(q.t=='type'){ready=Q.v.trim()!='';ans=q.a[0];b+=`<input id=in autocomplete=off autocapitalize=off value="${e(Q.v)}" ${Q.chk?'disabled':''} placeholder="Ketik jawabanmu…">`}
else{const o=q.t=='tf'?['Richtig ✅','Falsch ❌']:q.o,a=q.t=='tf'?(q.a?0:1):q.a;ready=Q.sel!==null;ans=o[a];
b+=o.map((x,j)=>`<button class="o ${Q.chk?(j==a?'ok':j==Q.sel?'no':''):(Q.sel===j?'on':'')}" data-act=pick data-j=${j}>${x}</button>`).join('')}
if(!Q.chk)b+=`<button id=ck class=btn style="margin-top:16px" data-act=check ${ready?'':'disabled'}>Check</button>`;
else b+=`<div class="fb ${Q.res?'ok':'no'}"><b>${Q.res?'Richtig! 🎉':Q.to?'Waktu habis! ⏰':'Leider falsch.'}</b><br>${Q.res?'':'Jawaban: <b>'+ans+'</b><br>'}${q.why}</div><button class=btn style="margin-top:12px" data-act=next>Weiter</button>`;
return b}
function check(to){const q=Q.l[Q.i];let r=false;clearInterval(TI);TI=0;
if(!to){if(q.t=='group')r=q.it.every((x,j)=>Q.g[j]===x[1]);
else if(q.t=='type'){const n=s=>s.toLowerCase().replace(/[.!?,]/g,'').trim();r=q.a.some(a=>n(a)==n(Q.v))}
else r=Q.sel===(q.t=='tf'?(q.a?0:1):q.a)}
Q.chk=true;Q.to=!!to;Q.res=r;if(r)Q.ok++;else Q.h--;sfx(r?'ok':'no');
if(r){confetti();anim('jump happy',1600);say(pick(['Super! 🎉','Toll! ⭐','Prima! 👏','Richtig! 😺'],1)[0])}else{anim('shake sad',900);say(to?'Zeit ist um! ⏰':'Nicht schlimm! 💪')}
render()}
function next(){if(Q.h<=0||Q.i+1>=Q.l.length){Q.end=true;const ps=Q.h>0&&Q.ok/Q.l.length>=.6;if(Q.st&&ps){P[Q.st.lv]=Math.max(P[Q.st.lv],Q.st.i+1);saveP()}sfx(Q.h<=0?'lose':'win');if(Q.h>0){confetti();anim('jump happy',1800);say('Geschafft! 🏆')}}else{Q.i++;Q.sel=null;Q.g={};Q.v='';Q.chk=false;Q.res=null;Q.to=false;Q.tr=false;setDl()}render(1)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.id=='mt'){setSnd(!snd);return}if(!started&&snd){started=true;bgStart()}const d=b.dataset,a=d.act;
if(d.say){speak(d.say,d.url);return}
if(a=='lv'){L=d.v;render(1)}
else if(a=='cover'){L=T=M=S=null;H=false;render(1)}
else if(a=='help'){H=true;render(1)}
else if(a=='cover2'){H=false;render(1)}
else if(a=='t'){T=DATA[+d.i];tab='w';render(1)}
else if(a=='home'){T=M=S=null;render(1)}
else if(a=='map'){M=L;S=null;Q=null;render(1)}
else if(a=='story'){S={lv:M,i:+d.i};render(1)}
else if(a=='sq')startStory()
else if(a=='tab'){tab=d.v;render()}
else if(a=='start')start(d.f)
else if(a=='back'){clearInterval(TI);TI=0;Q=null;render(1)}
else if(a=='tr'){Q.tr=!Q.tr;render()}
else if(a=='pick'&&!Q.chk){Q.sel=+d.j;render()}
else if(a=='cat'&&!Q.chk){Q.g[d.j]=+d.k;render()}
else if(a=='check')check()
else if(a=='next')next()});
document.addEventListener('input',ev=>{if(ev.target.id=='in'){Q.v=ev.target.value;document.getElementById('ck').disabled=!Q.v.trim()}});
document.addEventListener('change',ev=>{if(ev.target.id=='vs'){try{localStorage.setItem('mq_v',ev.target.value)}catch(x){}pickVoice();speak('Guten Tag! Das ist eine weiche Stimme.')}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='in'&&Q&&Q.v.trim()&&!Q.chk)check()});
document.body.insertAdjacentHTML('beforeend',`<button id="mt" aria-label="Musik an/aus">🎵</button><div id="cat" role="button" aria-label="Maskot"><div id="bub"></div>${CAT}</div>`);
document.getElementById('cat').onclick=()=>{const p=pick(PH,1)[0];say(p[0],2600);anim('jump happy',1600);speak(p[1],null,1)};
render();
</script></body></html>
